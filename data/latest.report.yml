ation/octet-stream","state":"uploaded","size":283,"digest":"sha256:74a812b412d4ca6472fde5f2b138ab852da67db6b4cc9eed65023fe6729fe90e","download_count":4,"created_at":"2026-09-10T18:54:51Z","updated_at":"2026-09-10T18:54:52Z"}],"body":"> Reasonix \u684c\u9762\u7aef\u8fc1\u79fb\u81f3 Electron\uff0c\u65b0\u589e DeepSeek V4.1 Flash \u56fe\u7247\u8f93\u5165\u3001OpenCode Go \u63d0\u4f9b\u5546\u9884\u8bbe\u3001\u6301\u4e45\u5de5\u5177\u6062\u590d\u548c\u72ec\u7acb dock \u6807\u7b7e\u3002\u672c\u7248\u672c\u5305\u542b v1.38.3 \u4ee5\u6765\u7684\u6539\u52a8\u3001macOS \u7b7e\u540d\u4e0e\u516c\u8bc1\u4fee\u590d\uff0c\u4ee5\u53ca Windows \u6269\u5c55\u5173\u95ed\u7a33\u5b9a\u6027\u4fee\u590d\uff1bv1.38.4 \u672a\u516c\u5f00\u53d1\u5e03\u3002\n\n**\u53d1\u5e03\u6e20\u9053\uff1a\u7a33\u5b9a\u7248 \u00b7 v1.38.5**\n\n[English \u2192](https://reasonix.io/changelog/v1.38.5/?lang=en) \u00b7 [\u7f51\u9875\u7248\u5b8c\u6574\u66f4\u65b0\u65e5\u5fd7 \u2192](https://reasonix.io/changelog/v1.38.5/)\n\n## \u4f7f\u7528\u653b\u7565\n\n- [**\u5de5\u5177\u6062\u590d**](https://github.com/esengine/DeepSeek-Reasonix/blob/645c156cdc14d577b9c9592e468e1d1530f29d5d/docs/TOOL_RECOVERY.md) \u2014 \u4e86\u89e3\u5982\u4f55\u5728\u684c\u9762\u548c\u8fdc\u7a0b\u4f1a\u8bdd\u4e2d\u6062\u590d\u4e2d\u65ad\u7684\u5de5\u5177\u6267\u884c\u3002\n- [**\u8bfb\u53d6\u8bc1\u636e\u751f\u547d\u5468\u671f**](https://github.com/esengine/DeepSeek-Reasonix/blob/645c156cdc14d577b9c9592e468e1d1530f29d5d/docs/READ_EVIDENCE_LIFECYCLE.md) \u2014 \u4e86\u89e3\u8bfb\u53d6\u8986\u76d6\u4e0e\u5199\u5165\u5b88\u536b\u5982\u4f55\u89e3\u8026\uff0c\u4ee5\u907f\u514d\u91cd\u590d\u5de5\u4f5c\u3002\n- [**\u8f93\u5165\u533a\u63a7\u4ef6**](https://github.com/esengine/DeepSeek-Reasonix/blob/645c156cdc14d577b9c9592e468e1d1530f29d5d/docs/COMPOSER_CONTROLS.md) \u2014 \u5173\u4e8e\u8f93\u5165\u533a\u5b9e\u65f6\u8bfb\u6570\u548c\u56de\u5408\u6307\u6807\u51c6\u786e\u6027\u6539\u8fdb\u7684\u8be6\u7ec6\u4fe1\u606f\u3002\n\n## \u6982\u89c8\n\n**Reasonix v1.38.5 \u2014 Reasonix v1.38.5**\n\nReasonix \u684c\u9762\u7aef\u8fc1\u79fb\u81f3 Electron\uff0c\u65b0\u589e DeepSeek V4.1 Flash \u56fe\u7247\u8f93\u5165\u3001OpenCode Go \u63d0\u4f9b\u5546\u9884\u8bbe\u3001\u6301\u4e45\u5de5\u5177\u6062\u590d\u548c\u72ec\u7acb dock \u6807\u7b7e\u3002\u672c\u7248\u672c\u5305\u542b v1.38.3 \u4ee5\u6765\u7684\u6539\u52a8\u3001macOS \u7b7e\u540d\u4e0e\u516c\u8bc1\u4fee\u590d\uff0c\u4ee5\u53ca Windows \u6269\u5c55\u5173\u95ed\u7a33\u5b9a\u6027\u4fee\u590d\uff1bv1.38.4 \u672a\u516c\u5f00\u53d1\u5e03\u3002\n\n\u53d1\u5e03\u65e5\u671f\uff1a2026-09-11\n\n**Desktop 28 \u00b7 CLI 9**\n\n## \u684c\u9762\u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop]** **Electron \u684c\u9762\u58f3** \u2014 \u684c\u9762\u7aef\u6539\u7528 Electron \u66ff\u4ee3 Wails\uff0c\u7531\u684c\u9762\u58f3\u7ba1\u7406\u7a97\u53e3\u751f\u547d\u5468\u671f\u3001\u7f29\u653e\u548c\u6d4f\u89c8\u5668\u9762\u677f\u3002 ([#9988](https://github.com/esengine/DeepSeek-Reasonix/pull/9988))\n- **[Desktop \u00b7 CLI]** **DeepSeek V4.1 Flash \u539f\u751f\u56fe\u7247\u8f93\u5165** \u2014 \u5b98\u65b9 DeepSeek \u63d0\u4f9b\u5546\u73b0\u652f\u6301 V4.1 Flash \u539f\u751f\u56fe\u7247\u8f93\u5165\u53ca 2026-09-10 \u4ef7\u683c\u8868\u3002\u6a21\u578b\u5217\u8868\u6b63\u786e\u62a5\u544a\u56fe\u7247\u80fd\u529b\uff0c\u6210\u672c\u62a5\u4ef7\u4f7f\u7528\u65b0\u4ef7\u683c\u3002 ([#10062](https://github.com/esengine/DeepSeek-Reasonix/pull/10062))\n- **[Desktop]** **\u6301\u4e45\u5de5\u5177\u6062\u590d** \u2014 \u4e2d\u65ad\u7684\u5de5\u5177\u6267\u884c\u73b0\u5728\u53ef\u4ee5\u5728\u684c\u9762\u548c\u8fdc\u7a0b\u4f1a\u8bdd\u4e2d\u901a\u8fc7\u8bc1\u636e\u652f\u6301\u7684\u64cd\u4f5c\u8fdb\u884c\u6062\u590d\uff0c\u5305\u62ec\u68c0\u67e5\u3001\u786e\u8ba4\u3001\u62d2\u7edd\u548c\u53ef\u9009\u7684\u5b89\u5168\u91cd\u8bd5\u3002 ([#10039](https://github.com/esengine/DeepSeek-Reasonix/pull/10039))\n- **[Desktop]** **\u5de5\u4f5c\u533a\u9694\u79bb\u542f\u52a8\u5668\u4e0e\u72ec\u7acb\u89c6\u56fe\u6807\u7b7e** \u2014 \u53f3\u4fa7 dock \u73b0\u652f\u6301\u6587\u4ef6\u3001\u6539\u52a8\u3001\u4e0a\u4e0b\u6587\u548c\u5bbf\u4e3b\u9762\u677f\u7684\u53ef\u91cd\u590d\u89c6\u56fe\u6807\u7b7e\uff0c\u6bcf\u4e2a\u89c6\u56fe\u72ec\u7acb\u6062\u590d\u72b6\u6001\uff0c\u5e76\u91c7\u7528\u5168\u5bbd\u6807\u9898\u680f\u3002 ([#10041](https://github.com/esengine/DeepSeek-Reasonix/pull/10041))\n- **[Desktop]** **\u4fee\u590d\u65e7\u7248\u8fdc\u7a0b Serve \u53d1\u9001\u5931\u8d25** \u2014 \u8fdc\u7a0b\u4f1a\u8bdd\u8fde\u63a5\u65e7\u7248 Serve \u65f6\u4e0d\u518d\u5931\u8d25\uff1b\u72b6\u6001\u63a2\u6d4b\u73b0\u5728\u80fd\u6b63\u786e\u5904\u7406 HTML \u7d22\u5f15\u54cd\u5e94\u3002 ([#10027](https://github.com/esengine/DeepSeek-Reasonix/pull/10027))\n- **[Desktop \u00b7 CLI]** **\u8bc1\u636e\u95e8\u7981\u4e0d\u518d\u91cd\u590d\u5de5\u4f5c** \u2014 \u64cd\u4f5c\u73b0\u5728\u7531\u5bbf\u4e3b\u62e5\u6709\uff0c\u9632\u6b62\u4ee3\u7406\u56e0\u8bc1\u636e\u6216\u9a8c\u8bc1\u4e0d\u5339\u914d\u800c\u91cd\u590d\u5de5\u4f5c\u3002 ([#10049](https://github.com/esengine/DeepSeek-Reasonix/pull/10049))\n- **[Desktop]** **\u51c6\u786e\u7684\u56de\u5408\u6307\u6807\u4e0e\u8f93\u5165\u533a\u5b9e\u65f6\u8bfb\u6570** \u2014 \u56de\u5408\u6307\u6807\u8bfb\u6570\u73b0\u5728\u6765\u81ea\u5355\u4e00\u6765\u6e90\uff0c\u5bf9\u6c49\u5b57\u5b57\u7b26\u7684\u4ee4\u724c\u4f30\u7b97\u66f4\u51c6\u786e\uff0c\u5e76\u5728\u8f93\u5165\u533a\u8fd0\u884c\u6761\u4e2d\u663e\u793a\u5b9e\u65f6\u8bfb\u6570\u3002 ([#10059](https://github.com/esengine/DeepSeek-Reasonix/pull/10059))\n- **[Desktop]** **\u786c\u4ef6\u52a0\u901f\u8bbe\u7f6e** \u2014 \u65b0\u589e\u6301\u4e45\u5316\u7684 Electron \u786c\u4ef6\u52a0\u901f\u8bbe\u7f6e\uff0c\u5e76\u63d0\u4f9b\u9488\u5bf9\u9ed1\u5c4f\u548c\u6e32\u67d3\u6545\u969c\u7684\u6062\u590d\u8986\u76d6\u3002 ([#10040](https://github.com/esengine/DeepSeek-Reasonix/pull/10040))\n\n### \u65b0\u589e\n\n- **[Desktop \u00b7 CLI]** **DeepSeek V4.1 Flash \u652f\u6301** \u2014 \u5b98\u65b9 DeepSeek \u63d0\u4f9b\u5546\u73b0\u652f\u6301 V4.1 Flash \u539f\u751f\u56fe\u7247\u8f93\u5165\u53ca 2026-09-10 \u4ef7\u683c\u8868\u3002 ([#10062](https://github.com/esengine/DeepSeek-Reasonix/pull/10062))\n- **[Desktop]** **\u6301\u4e45\u5de5\u5177\u6062\u590d** \u2014 \u4e2d\u65ad\u7684\u5de5\u5177\u6267\u884c\u53ef\u4ee5\u5728\u684c\u9762\u548c\u8fdc\u7a0b\u4f1a\u8bdd\u4e2d\u901a\u8fc7\u8bc1\u636e\u652f\u6301\u7684\u64cd\u4f5c\u8fdb\u884c\u6062\u590d\u3002 ([#10039](https://github.com/esengine/DeepSeek-Reasonix/pull/10039))\n- **[Desktop]** **\u5de5\u4f5c\u533a\u9694\u79bb\u542f\u52a8\u5668\u4e0e\u72ec\u7acb\u89c6\u56fe\u6807\u7b7e** \u2014 \u53f3\u4fa7 dock \u652f\u6301\u6587\u4ef6\u3001\u6539\u52a8\u3001\u4e0a\u4e0b\u6587\u548c\u5bbf\u4e3b\u9762\u677f\u7684\u53ef\u91cd\u590d\u89c6\u56fe\u6807\u7b7e\uff0c\u6bcf\u4e2a\u89c6\u56fe\u72ec\u7acb\u6062\u590d\u72b6\u6001\u3002 ([#10041](https://github.com/esengine/DeepSeek-Reasonix/pull/10041))\n- **[Desktop]** **\u786c\u4ef6\u52a0\u901f\u8bbe\u7f6e** \u2014 \u6301\u4e45\u5316\u7684 Electron \u786c\u4ef6\u52a0\u901f\u8bbe\u7f6e\uff0c\u5e76\u63d0\u4f9b\u6062\u590d\u8986\u76d6\u3002 ([#10040](https://github.com/esengine/DeepSeek-Reasonix/pull/10040))\n- **[Desktop]** **Electron \u684c\u9762\u58f3** \u2014 \u684c\u9762\u7aef\u6539\u7528 Electron \u66ff\u4ee3 Wails\uff0c\u7531\u684c\u9762\u58f3\u7ba1\u7406\u7a97\u53e3\u751f\u547d\u5468\u671f\u3001\u7f29\u653e\u548c\u6d4f\u89c8\u5668\u9762\u677f\u3002 ([#9988](https://github.com/esengine/DeepSeek-Reasonix/pull/9988))\n- **[Desktop \u00b7 CLI]** **OpenCode Go \u63d0\u4f9b\u5546\u9884\u8bbe** \u2014 \u65b0\u589e OpenCode Go curated \u63d0\u4f9b\u5546\u9884\u8bbe\uff0c\u5176\u8def\u7531\u3001\u63a8\u7406\u4e0e\u641c\u7d22\u5951\u7ea6\u5df2\u8fc1\u79fb\u5230\u5f53\u524d\u5185\u6838\u3002 ([#10015](https://github.com/esengine/DeepSeek-Reasonix/pull/10015))\n\n### \u6539\u8fdb\n\n- **[Desktop]** **\u56de\u5408\u6307\u6807\u51c6\u786e\u6027\u4e0e\u8f93\u5165\u533a\u5b9e\u65f6\u8bfb\u6570** \u2014 \u56de\u5408\u6307\u6807\u73b0\u5728\u4f7f\u7528\u5355\u4e00\u6765\u6e90\uff0c\u6c49\u5b57\u4ee4\u724c\u4f30\u7b97\u66f4\u51c6\u786e\uff0c\u5e76\u5728\u8f93\u5165\u533a\u8fd0\u884c\u6761\u4e2d\u663e\u793a\u5b9e\u65f6\u8bfb\u6570\u3002 ([#10059](https://github.com/esengine/DeepSeek-Reasonix/pull/10059))\n- **[Desktop]** **Electron \u7f29\u653e\u5f52\u5c5e\u4e0e\u65e7\u914d\u7f6e\u8fc1\u79fb** \u2014 \u5e94\u7528\u7f29\u653e\u4f7f\u7528\u7248\u672c\u5316\u7684 Electron \u5b58\u50a8\uff0c\u5e76\u4e00\u6b21\u6027\u5bfc\u5165\u65e7\u7248\u4e2d\u7531\u7528\u6237\u660e\u786e\u8bbe\u7f6e\u7684\u7f29\u653e\u6bd4\u4f8b\u3002 ([#10014](https://github.com/esengine/DeepSeek-Reasonix/pull/10014))\n- **[Desktop]** **\u5916\u90e8\u94fe\u63a5\u534f\u8bae\u9650\u5236** \u2014 \u5916\u90e8\u94fe\u63a5\u4ec5\u5141\u8bb8 http\u3001https \u548c mailto \u534f\u8bae\u3002 ([#10005](https://github.com/esengine/DeepSeek-Reasonix/pull/10005))\n\n### \u4fee\u590d\n\n- **[Desktop \u00b7 CLI]** **Windows \u6269\u5c55\u5173\u95ed\u7a33\u5b9a\u6027** \u2014 \u5f3a\u5236\u5173\u95ed\u6269\u5c55\u4e0e\u6b63\u5e38\u8fdb\u7a0b\u56de\u6536\u73b0\u5728\u53ea\u91ca\u653e\u4e00\u6b21 Windows \u8fdb\u7a0b\u8ddf\u8e2a\u53e5\u67c4\uff0c\u907f\u514d\u540e\u7eed\u6e05\u7406\u8bef\u5173\u5df2\u88ab\u5176\u4ed6\u5bf9\u8c61\u590d\u7528\u7684\u53e5\u67c4\u3002 ([#10082](https://github.com/esengine/DeepSeek-Reasonix/pull/10082))\n- **[Desktop]** **\u65e7\u7248\u8fdc\u7a0b Serve \u53d1\u9001\u5931\u8d25** \u2014 \u8fdc\u7a0b\u4f1a\u8bdd\u8fde\u63a5\u65e7\u7248 Serve \u65f6\u4e0d\u518d\u5931\u8d25\uff1b\u72b6\u6001\u63a2\u6d4b\u80fd\u6b63\u786e\u5904\u7406 HTML \u7d22\u5f15\u54cd\u5e94\u3002 ([#10027](https://github.com/esengine/DeepSeek-Reasonix/pull/10027))\n- **[Desktop \u00b7 CLI]** **\u8bc1\u636e\u95e8\u7981\u4e0d\u518d\u91cd\u590d\u5de5\u4f5c** \u2014 \u64cd\u4f5c\u7531\u5bbf\u4e3b\u62e5\u6709\uff0c\u9632\u6b62\u56e0\u8bc1\u636e\u6216\u9a8c\u8bc1\u4e0d\u5339\u914d\u800c\u91cd\u590d\u5de5\u4f5c\u3002 ([#10049](https://github.com/esengine/DeepSeek-Reasonix/pull/10049))\n- **[Desktop]** **macOS \u5e94\u7528\u7b7e\u540d\u987a\u5e8f** \u2014 \u5728\u4e3b\u7a0b\u5e8f\u4e0e\u5916\u5c42\u5e94\u7528\u5305\u5b8c\u6210\u7b7e\u540d\u524d\uff0c\u5148\u7b7e\u540d\u76f8\u90bb\u7684 Go \u670d\u52a1\uff0c\u4fee\u590d\u672c\u6b21\u53d1\u73b0\u7684\u516c\u8bc1\u5931\u8d25\u3002 ([#10078](https://github.com/esengine/DeepSeek-Reasonix/pull/10078))\n- **[Desktop]** **\u5b8c\u6574\u7684 Electron macOS \u5305\u7b7e\u540d** \u2014 \u5bf9 Electron \u5305\u4e2d\u7684\u6240\u6709\u5d4c\u5957\u4ee3\u7801\u5bf9\u8c61\uff08\u5305\u62ec Go \u4fa7\u8f66\u548c\u6846\u67b6\uff09\u8fdb\u884c\u7b7e\u540d\uff0c\u4ee5\u901a\u8fc7\u516c\u8bc1\u3002 ([#10072](https://github.com/esengine/DeepSeek-Reasonix/pull/10072))\n- **[Desktop \u00b7 CLI]** **\u89e3\u8026\u8bfb\u53d6\u8986\u76d6\u4e0e\u5199\u5165\u5b88\u536b** \u2014 \u90e8\u5206\u6587\u4ef6\u8bfb\u53d6\u4e0d\u518d\u51bb\u7ed3\u72ec\u7acb\u5de5\u5177\u548c\u6700\u7ec8\u7b54\u6848\u3002 ([#10038](https://github.com/esengine/DeepSeek-Reasonix/pull/10038))\n- **[Desktop]** **\u6062\u590d 104px \u8f93\u5165\u6846\u9ed8\u8ba4\u9ad8\u5ea6** \u2014 \u65b0\u914d\u7f6e\u6587\u4ef6\u73b0\u5728\u518d\u6b21\u4f7f\u7528\u7d27\u51d1\u7684 104px \u8f93\u5165\u6846\u9ad8\u5ea6\u3002 ([#9990](https://github.com/esengine/DeepSeek-Reasonix/pull/9990))\n- **[Desktop]** **\u4fee\u590d\u8fd0\u884c\u4e2d\u8f93\u5165\u63a7\u4ef6\u53ef\u7528\u6027** \u2014 \u8fd0\u884c\u4e2d\u7684\u672c\u5730\u684c\u9762\u4efb\u52a1\u73b0\u5728\u53ef\u4ee5\u901a\u8fc7\u73b0\u6709\u8f93\u5165\u63a7\u4ef6\u6dfb\u52a0\u9644\u4ef6\u548c\u5f15\u7528\u3002 ([#9984](https://github.com/esengine/DeepSeek-Reasonix/pull/9984))\n- **[Desktop]** **\u4fee\u590d catalog \u5173\u95ed\u65f6\u72b6\u6001\u5237\u65b0\u8d85\u65f6** \u2014 \u5386\u53f2\u76ee\u5f55\u5173\u95ed\u65f6\u4f1a\u53d6\u6d88\u8fdb\u884c\u4e2d\u7684\u72b6\u6001\u5237\u65b0\uff0c\u907f\u514d\u5237\u65b0\u5de5\u4f5c\u8d85\u8fc7\u76ee\u