application/octet-stream","state":"uploaded","size":283,"digest":"sha256:68f4f38a44b49814be66b77d816be9aa5b2ff7238d8a4be4648dfff4552312a6","download_count":5,"created_at":"2026-09-11T01:05:58Z","updated_at":"2026-09-11T01:05:58Z"}],"body":"> \u4fee\u590d\u4e86\u5bfc\u81f4\u5b98\u65b9\u684c\u9762\u5b89\u88c5\u5305\u65e0\u6cd5\u542f\u52a8\u7684\u6784\u5efa\u4e0d\u5339\u914d\u95ee\u9898\u3002\n\n**\u53d1\u5e03\u6e20\u9053\uff1a\u7a33\u5b9a\u7248 \u00b7 v1.38.6**\n\n[English \u2192](https://reasonix.io/changelog/v1.38.6/?lang=en) \u00b7 [\u7f51\u9875\u7248\u5b8c\u6574\u66f4\u65b0\u65e5\u5fd7 \u2192](https://reasonix.io/changelog/v1.38.6/)\n\n## \u6982\u89c8\n\n**Reasonix v1.38.6 \u2014 \u4fee\u590d\u684c\u9762\u7aef\u65e0\u6cd5\u542f\u52a8**\n\n\u4fee\u590d\u4e86\u5bfc\u81f4\u5b98\u65b9\u684c\u9762\u5b89\u88c5\u5305\u65e0\u6cd5\u542f\u52a8\u7684\u6784\u5efa\u4e0d\u5339\u914d\u95ee\u9898\u3002\n\n\u53d1\u5e03\u65e5\u671f\uff1a2026-09-11\n\n**Desktop 4 \u00b7 CLI 1**\n\n## \u684c\u9762\u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop]** **\u5b98\u65b9\u684c\u9762\u5b89\u88c5\u5305\u53ef\u6b63\u5e38\u542f\u52a8** \u2014 \u4fee\u590d v1.38.5 \u5728\u5168\u65b0\u5b89\u88c5\u6216\u5347\u7ea7\u540e\u51fa\u73b0 build_mismatch\u3001\u65e0\u6cd5\u6253\u5f00\u7684\u95ee\u9898\u3002\u684c\u9762\u58f3\u4e0e\u5185\u7f6e\u670d\u52a1\u73b0\u5728\u4f7f\u7528\u4e00\u81f4\u7684\u53d1\u5e03\u7248\u672c\u4fe1\u606f\u3002 ([#10089](https://github.com/esengine/DeepSeek-Reasonix/pull/10089))\n\n### \u4fee\u590d\n\n- **[Desktop]** **\u53d1\u5e03\u524d\u9a8c\u8bc1\u6b63\u5f0f\u5305\u542f\u52a8** \u2014 Windows\u3001macOS \u548c Linux \u53d1\u5e03\u68c0\u67e5\u73b0\u5728\u4ee5\u6b63\u5f0f\u6a21\u5f0f\u542f\u52a8\u6253\u5305\u5e94\u7528\uff0c\u8981\u6c42\u670d\u52a1\u63e1\u624b\u3001\u754c\u9762\u5230\u670d\u52a1\u7684\u5b9e\u9645\u8c03\u7528\u53ca\u6b63\u5e38\u9000\u51fa\u5168\u90e8\u6210\u529f\u3002\u6784\u5efa\u4fe1\u606f\u7f3a\u5931\u6216\u65e0\u6548\u65f6\u4ecd\u4f1a\u62a5\u9519\u3002 ([#10089](https://github.com/esengine/DeepSeek-Reasonix/pull/10089))\n\n## CLI \u7aef\u66f4\u65b0\n\n\u6b64\u677f\u5757\u6ca1\u6709\u529f\u80fd\u6216\u4fee\u590d\u6761\u76ee\uff1b\u76f8\u5173\u8bf4\u660e\u8bf7\u67e5\u770b\u4e0b\u65b9\u5347\u7ea7\u63d0\u9192\u548c\u98ce\u9669\u63d0\u793a\u3002\n\n## \u5347\u7ea7\u63d0\u9192\n\n- **[Desktop]** **\u5b89\u88c5\u5b8c\u6574\u5305\u6062\u590d\u542f\u52a8** \u2014 \u5982\u679c v1.38.5 \u65e0\u6cd5\u6253\u5f00\uff0c\u8bf7\u4e0b\u8f7d\u5e76\u5b89\u88c5 v1.38.6 \u5b8c\u6574\u5305\uff0c\u65e0\u9700\u6e05\u7406\u914d\u7f6e\u6216\u4f1a\u8bdd\u6570\u636e\u3002\u4ece v1.38.3 \u6216\u66f4\u65e9 Wails \u7248\u672c\u9996\u6b21\u5347\u7ea7\u5230 Electron \u65f6\uff0c\u4e5f\u9700\u8981\u624b\u52a8\u5b89\u88c5\u5b8c\u6574\u5305\uff1b\u65e7\u7248\u66f4\u65b0\u5668\u65e0\u6cd5\u5b89\u88c5\u65b0\u7684\u76ee\u5f55\u7ed3\u6784\u3002 ([#10089](https://github.com/esengine/DeepSeek-Reasonix/pull/10089))\n\n## \u98ce\u9669\u63d0\u793a\n\n- **[Desktop \u00b7 CLI]** **OpenCode Go Responses \u641c\u7d22\u9650\u5236\u4ecd\u7136\u5b58\u5728** \u2014 \u672c\u6b21\u542f\u52a8\u4fee\u590d\u672a\u6539\u53d8\u6b64\u524d\u5df2\u62a5\u544a\u7684 OpenCode Go Responses \u539f\u751f\u641c\u7d22\u9650\u5236\u3002\u9700\u8981\u8054\u7f51\u641c\u7d22\u65f6\uff0c\u8bf7\u4f7f\u7528 v1.38.5 \u5df2\u9a8c\u8bc1\u7684 Anthropic \u641c\u7d22\u8def\u5f84\u3002 ([#10015](https://github.com/esengine/DeepSeek-Reasonix/pull/10015), [#10081](https://github.com/esengine/DeepSeek-Reasonix/pull/10081))\n\n## \u81f4\u8c22\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a[@SivanCola](https://github.com/SivanCola)\n\n## \u4e0b\u8f7d\u4e0e\u5b89\u88c5\n\n- [\u5b98\u7f51\u6309\u5e73\u53f0\u4e0b\u8f7d](https://reasonix.io/?download=desktop&channel=stable#start)\n- [\u67e5\u770b\u5b8c\u6574\u5dee\u5f02](https://github.com/esengine/DeepSeek-Reasonix/compare/desktop-v1.38.5...desktop-v1.38.6)\n"}
